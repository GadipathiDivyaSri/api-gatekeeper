# API Gatekeeper — Benign Test Samples
# Challenging test cases that must NEVER trigger any false positive rule hits.

- id: benign-001
  description: Name with apostrophe
  category: benign
  label: benign
  method: GET
  path: /api/products
  query:
    search: "O'Brien"
  body: null
  headers: {}

